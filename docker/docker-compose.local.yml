services:
  postgres:
    image: postgres:17-alpine
    env_file: ../.env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: ..
      target: migrator
    env_file: ../.env.local
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
    env_file: ../.env.local
    ports:
      - "3000:3000"
    environment:
      BOT_API_URL: ${BOT_API_URL:-http://localhost:3002}
      BOT_API_SECRET: ${BOT_API_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
